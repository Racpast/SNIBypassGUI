listen 22222;
proxy_ssl_server_name on;
proxy_ssl_name $sni;
location / {
    if ($http_upgrade) {
        rewrite ^ /__ws_proxy$uri last;
    }
    proxy_pass https://$backend;
    include shared/location/base.conf;
}
location ^~ /__ws_proxy {
    internal;
    rewrite ^/__ws_proxy(.*)$ $1 break;
    proxy_pass https://$backend;
    include shared/location/ws.conf;
}
