# Although several workers can be started, only one of them actually does any work.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    http2 on;

    log_format custom_log 'Time: [$time_local] | Request Method: "$request_method" | Request URI: "$scheme://$http_host$request_uri" | Status Code: $status | Response Time: $upstream_response_time seconds | Upstream Address: $upstream_addr';
    access_log off;
    # access_log logs/access.log custom_log;
    error_log logs/error.log;

    server_names_hash_max_size 32768;
    server_names_hash_bucket_size 256;
    map_hash_bucket_size 256;

    resolver 223.5.5.5 119.29.29.29 valid=60s ipv6=off;
    resolver_timeout 3s;

    keepalive_timeout 120s;
    keepalive_requests 2048;

    client_max_body_size 0;
    client_header_buffer_size 64k;
    large_client_header_buffers 8 32k;

    proxy_socket_keepalive on;
    proxy_ssl_verify off;
    proxy_ssl_server_name off;

    proxy_connect_timeout 5s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_buffer_size 64k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_max_temp_file_size 0;

    proxy_next_upstream error timeout http_421 http_429 http_503;
    proxy_next_upstream_tries 0;
    proxy_next_upstream_timeout 120s;

    proxy_cache_path "cache" levels=1:2 keys_zone=wh_cache:10m max_size=1g inactive=7d use_temp_path=off;
    proxy_cache $static_cache;
    proxy_cache_valid 200 301 7d;
    proxy_cache_use_stale error timeout updating;

    map $uri $static_cache {
        ~*\.(js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ wh_cache;
        default off;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    include sites/*.conf;

    server {
        listen 22222;
        server_name .snib snib.test;
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><title>It works!</title></head><body><h1>It works!</h1><p>This is the default web page for this server.</p><p>The web server software is running but no content has been configured, yet.</p></body></html>';
    }

    server {
        listen 22222 default_server;
        return 418;
    }

    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }
}
