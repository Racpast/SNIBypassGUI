map $host $flickr_backend {
    identity.flickr.com $host;
    default flickr.com;
}

upstream identity.flickr.com {
    server 3.209.240.130:443;
    keepalive 64;
}

upstream flickr.com {
    server 13.33.142.102:443;
    keepalive 64;
}

server {
    server_name .flickr.com;
    set $backend $flickr_backend;
    include shared/server/base.conf;
}
