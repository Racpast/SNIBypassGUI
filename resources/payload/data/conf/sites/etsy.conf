upstream etsy.com {
    least_time header;
    server 151.101.1.224:443 max_fails=3 fail_timeout=15s;
    server 151.101.65.224:443 max_fails=3 fail_timeout=15s;
    server 151.101.129.224:443 max_fails=3 fail_timeout=15s;
    server 151.101.193.224:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    server_name .etsy.com;
    set $backend etsy.com;
    include shared/server/base.conf;
}
