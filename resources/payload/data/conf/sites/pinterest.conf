map $host $pinterest_backend {
    hostnames;
    *.pinterest.com pinterest.fastly;
    default pinterest.com;
}

upstream pinterest.fastly {
    zone pinterest.fastly 512k;
    least_time header;
    include shared/upstream/fastly.conf;
    keepalive 64;
}

upstream pinterest.com {
    least_time header;
    server 151.101.192.84:443 max_fails=3 fail_timeout=15s;
    server 151.101.0.84:443 max_fails=3 fail_timeout=15s;
    server 151.101.128.84:443 max_fails=3 fail_timeout=15s;
    server 151.101.64.84:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    server_name .pinterest.com .pinimg.com;
    set $backend $pinterest_backend;
    include shared/server/base.conf;
}
