upstream urbandictionary.bunny {
    least_time header;
    include shared/upstream/bunny.conf;
    keepalive 64;
}

server {
    server_name .urbandictionary.com;
    set $backend urbandictionary.bunny;
    include shared/server/base.conf;
}
