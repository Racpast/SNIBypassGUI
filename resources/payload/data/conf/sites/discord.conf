map $host $discord_backend {
    hostnames;
    .discord.gg discord.gg;
    .discordapp.com discordapp.com;
    .discordapp.net media.discordapp.net;
    default discord.com;
}

upstream discord.com {
    least_time header;
    server 162.159.128.233:443 max_fails=3 fail_timeout=15s;
    server 162.159.136.232:443 max_fails=3 fail_timeout=15s;
    server 162.159.135.232:443 max_fails=3 fail_timeout=15s;
    server 162.159.138.232:443 max_fails=3 fail_timeout=15s;
    server 162.159.137.232:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream discord.gg {
    least_time header;
    server 162.159.136.234:443 max_fails=3 fail_timeout=15s;
    server 162.159.134.234:443 max_fails=3 fail_timeout=15s;
    server 162.159.130.234:443 max_fails=3 fail_timeout=15s;
    server 162.159.135.234:443 max_fails=3 fail_timeout=15s;
    server 162.159.133.234:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream discordapp.com {
    least_time header;
    server 162.159.135.233:443 max_fails=3 fail_timeout=15s;
    server 162.159.130.233:443 max_fails=3 fail_timeout=15s;
    server 162.159.133.233:443 max_fails=3 fail_timeout=15s;
    server 162.159.134.233:443 max_fails=3 fail_timeout=15s;
    server 162.159.129.233:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream media.discordapp.net {
    least_time header;
    server 162.159.129.232:443 max_fails=3 fail_timeout=15s;
    server 162.159.134.232:443 max_fails=3 fail_timeout=15s;
    server 162.159.130.232:443 max_fails=3 fail_timeout=15s;
    server 162.159.128.232:443 max_fails=3 fail_timeout=15s;
    server 162.159.133.232:443 max_fails=3 fail_timeout=15s;
    keepalive 128;
}

server {
    server_name .discord.com .discord.gg .discordapp.com .discordapp.net;
    set $backend $discord_backend;
    include shared/server/base.conf;
}
