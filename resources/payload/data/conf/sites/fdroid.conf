map $host $fdroid_backend {
    forum.f-droid.org $host;
    default f-droid.org;
}

upstream f-droid.org {
    least_time header;
    server 37.218.243.72:443 max_fails=3 fail_timeout=15s;
    server 37.218.247.73:443 max_fails=3 fail_timeout=15s;
    server 65.21.79.229:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream forum.f-droid.org {
    server 37.218.242.53:443;
    keepalive 64;
}

server {
    server_name .f-droid.org;
    set $backend $fdroid_backend;
    include shared/server/base.conf;
    location /message-bus/ {
        include shared/location/base.conf;
        proxy_pass https://$backend;
        proxy_buffering off;
    }
}
