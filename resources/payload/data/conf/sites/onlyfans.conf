map $host $onlyfans_backend {
    hostnames;
    id.onlyfans.com $host;
    .start.onlyfans.com ext-cust.squarespace.com;
    default onlyfans.cloudfront;
}

upstream id.onlyfans.com {
    zone id.onlyfans.com 64k;
    least_time header;
    server app-kycspa-prod-ondato.azurewebsites.net:443 resolve;
    keepalive 64;
}

upstream ext-cust.squarespace.com {
    zone ext-cust.squarespace.com 64k;
    least_time header;
    server ext-cust.squarespace.com:443 max_fails=3 fail_timeout=15s resolve;
    keepalive 64;
}

upstream onlyfans.cloudfront {
    least_time header;
    include shared/upstream/cloudfront.conf;
    keepalive 64;
}

server {
    server_name .onlyfans.com;
    set $backend $onlyfans_backend;
    include shared/server/base.conf;
}
