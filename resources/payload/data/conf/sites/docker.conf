map $host $docker_backend {
    hostnames;
    hub.docker.com hub-origin.docker.com;
    auth.docker.io hub-origin.docker.com;
    production.cloudflare.docker.com $host;
    registry.hub.docker.com registry.ipv4.docker.com;
    registry-stage.hub.docker.com registry-1-stage.docker.io.cdn.cloudflare.net;
    .dockerstatus.com docker.cloudfront;
    ~^(?:index|registry-1|registry|cdn-registry|cdn-registry-1)\.docker\.io$ registry.ipv4.docker.com;
    ~^(?:(?:www|docs|blog|get|notary|notary-stage|test|status|jobs)\.)?docker\.io$ elb-io.us-east-1.aws.dckr.io;
    ~^(?:registry-1-stage|index-stage|cdn-registry-1-stage|registry-staging|registry-stage|auth-stage)\.docker\.io$ registry-1-stage.docker.io.cdn.cloudflare.net;
    default $host;
}

upstream hub-origin.docker.com {
    least_time header;
    server hub-origin.docker.com:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream registry.ipv4.docker.com {
    least_time header;
    server registry.ipv4.docker.com:443 max_fails=2 fail_timeout=15s;
    keepalive 64;
}

upstream registry-1-stage.docker.io.cdn.cloudflare.net {
    least_time header;
    server registry-1-stage.docker.io.cdn.cloudflare.net:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream elb-io.us-east-1.aws.dckr.io {
    least_time header;
    server elb-io.us-east-1.aws.dckr.io:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream production.cloudflare.docker.com {
    least_time header;
    server 104.16.98.215:443 max_fails=3 fail_timeout=15s;
    server 104.16.100.215:443 max_fails=3 fail_timeout=15s;
    server 104.16.97.215:443 max_fails=3 fail_timeout=15s;
    server 104.16.101.215:443 max_fails=3 fail_timeout=15s;
    server 104.16.99.215:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream docker.cloudfront {
    least_time header;
    include shared/upstream/cloudfront.conf;
    keepalive 64;
}

server {
    server_name .docker.com .docker.io .dockerstatus.com;
    set $backend $docker_backend;
    include shared/server/base.conf;
}
