upstream dual-spov-0006.spov-msedge.net {
    zone dual-spov-0006.spov-msedge.net 64k;
    least_time header;
    server dual-spov-0006.spov-msedge.net:443 resolve;
    keepalive 64;
}

server {
    server_name .onedrive.live.com;
    set $backend dual-spov-0006.spov-msedge.net;
    proxy_request_buffering off;
    include shared/server/base.conf;
}
