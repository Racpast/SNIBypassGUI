upstream apkmirror.com {
    least_time header;
    server 104.17.67.215:443 max_fails=3 fail_timeout=15s;
    server 104.17.65.215:443 max_fails=3 fail_timeout=15s;
    server 104.17.68.215:443 max_fails=3 fail_timeout=15s;
    server 104.17.66.215:443 max_fails=3 fail_timeout=15s;
    server 104.17.69.215:443 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    server_name .apkmirror.com;
    set $backend apkmirror.com;
    include shared/server/base.conf;
}
