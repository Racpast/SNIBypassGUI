upstream xnxx.com {
    least_time header;
    server 152.233.100.11:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.7:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.1:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.3:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.12:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.4:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.9:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.10:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.15:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.5:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.13:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.8:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.2:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.14:443 max_fails=2 fail_timeout=15s;
    server 152.233.100.6:443 max_fails=2 fail_timeout=15s;
    keepalive 64;
}

server {
    server_name .xnxx.com;
    set $backend xnxx.com;
    include shared/server/base.conf;
}
