map $host $gelbooru_backend {
    img4.gelbooru.com $host;
    default gelbooru.com;
}

upstream gelbooru.com {
    server 131.143.124.72:443;
    keepalive 64;
}

upstream img4.gelbooru.com {
    server 131.143.124.74:443;
    keepalive 64;
}

server {
    server_name .gelbooru.com;
    set $backend $gelbooru_backend;
    include shared/server/base.conf;
}
