map $host $duckduckgo_backend {
    external-content.duckduckgo.com $host;
    default duckduckgo.com;
}

upstream duckduckgo.com {
    least_time header;
    server 20.204.244.192:443 max_fails=3 fail_timeout=15s;
    server 20.43.161.105:443 max_fails=3 fail_timeout=15s;
    server 40.114.177.156:443 max_fails=3 fail_timeout=15s;
    server 52.142.124.215:443 max_fails=3 fail_timeout=15s;
    server 52.250.42.157:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream external-content.duckduckgo.com {
    least_time header;
    server 20.204.245.84:443 max_fails=3 fail_timeout=15s;
    server 20.43.160.189:443 max_fails=3 fail_timeout=15s;
    server 40.114.178.124:443 max_fails=3 fail_timeout=15s;
    server 52.142.125.222:443 max_fails=3 fail_timeout=15s;
    server 104.209.88.197:443 max_fails=3 fail_timeout=15s;
    keepalive 128;
}

server {
    server_name .duckduckgo.com;
    set $backend $duckduckgo_backend;
    include shared/server/base.conf;
}
