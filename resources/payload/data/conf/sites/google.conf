map $host $google_backend {
    hostnames;
    .scholar.google.com google.backend.cn;
    default google.backend.sg;
}

upstream google.backend.cn {
    server 183.56.143.147:443;
    keepalive 64;
}

upstream google.backend.sg {
    least_time header;
    server 8.138.21.175:443 max_fails=3 fail_timeout=15s;
    server 8.134.173.202:443 max_fails=3 fail_timeout=15s;
    server 47.103.46.164:443 max_fails=3 fail_timeout=15s;
    server 47.103.34.63:443 max_fails=3 fail_timeout=15s;
    server 47.104.21.37:443 max_fails=3 fail_timeout=15s;
    server 47.104.71.109:443 max_fails=3 fail_timeout=15s;
    server 47.113.110.152:443 max_fails=3 fail_timeout=15s;
    # server 120.79.149.13:443 max_fails=3 fail_timeout=15s;
    # server 121.43.177.34:443 max_fails=3 fail_timeout=15s;
    # server 121.43.186.252:443 max_fails=3 fail_timeout=15s;
    keepalive 128;
}

