split_clients $request_id $gvs_base_domain {
    14% "gvt1.com";
    14% "xn--ngstr-lra8j.com";
    14% "bdn.dev";
    14% "c.2mdn.net";
    14% "snap.gvt1.com";
    14% "gcpcdn.gvt1.com";
    * "offline-maps.gvt1.com";
}

server {
    server_name ~^(?<gvs_node>.+)\.googlevideo\.com$;
    resolver 223.5.5.5 119.29.29.29 valid=60s ipv4=off ipv6=on;
    set $sni g.cn;
    set $backend $gvs_node.$gvs_base_domain;
    include shared/server/base.conf;
}
