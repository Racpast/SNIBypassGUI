map $host $ehentai_backend {
    hostnames;
    api.e-hentai.org api.e-hentai.org;
    .exhentai.org exhentai.org;
    .ehgt.org ehgt.org;
    ~^(?:upload|upld)\.e-hentai\.org$ upload.e-hentai.org;
    default e-hentai.org;
}

upstream e-hentai.org {
    least_time header;
    server 172.66.132.196:443 max_fails=3 fail_timeout=15s;
    server 172.66.140.62:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream exhentai.org {
    least_time header;
    server 178.175.132.22:443 max_fails=3 fail_timeout=15s;
    server 178.175.129.254:443 max_fails=3 fail_timeout=15s;
    server 178.175.128.254:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream api.e-hentai.org {
    least_time header;
    server 89.149.222.80:443 max_fails=2 fail_timeout=15s;
    server 5.79.104.110:443 max_fails=2 fail_timeout=15s;
    server 37.48.81.204:443 max_fails=2 fail_timeout=15s;
    server 37.48.92.161:443 max_fails=2 fail_timeout=15s;
    server 212.7.200.104:443 max_fails=2 fail_timeout=15s;
    server 212.7.202.51:443 max_fails=2 fail_timeout=15s;
    server 95.211.79.44:443 max_fails=2 fail_timeout=15s;
    keepalive 64;
}

upstream ehgt.org {
    least_time header;
    server 89.39.106.43:443 max_fails=3 fail_timeout=15s;
    server 62.112.8.21:443 max_fails=3 fail_timeout=15s;
    server 109.236.85.28:443 max_fails=3 fail_timeout=15s;
    keepalive 128;
}

upstream upload.e-hentai.org {
    least_time header;
    server 95.211.208.236:443 max_fails=3 fail_timeout=15s;
    server 89.149.221.236:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    server_name .e-hentai.org .exhentai.org .ehgt.org;
    set $backend $ehentai_backend;
    include shared/server/base.conf;
}

server {
    server_name upld.e-hentai.org upload.e-hentai.org;
    proxy_request_buffering off;
    set $backend $ehentai_backend;
    include shared/server/base.conf;
}
