map $host $telegram_backend {
    ~^(?<type>[zk])ws[13](-1)?\.web\.telegram\.org$ telegram_${type}ws_13;
    ~^(?<type>[zk])ws5(-1)?\.web\.telegram\.org$ telegram_${type}ws_5;
    ~^[zk]ws[24](-1)?\.web\.telegram\.org$ telegram_default;
    ~^cdn(?<num>[145])\.(telesco\.pe|cdn-telegram\.org)$ cdn$num.cdn-telegram.org;
    default telegram_default;
}

upstream telegram_default {
    least_time header;
    server 45.192.12.153:443 max_fails=3 fail_timeout=15s;
    server 149.154.166.110:443 max_fails=3 fail_timeout=15s;
    server 149.154.161.145:443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream telegram_zws_13 { server 149.154.174.200:443; keepalive 64; }
upstream telegram_kws_13 { server 149.154.174.100:443; keepalive 64; }
upstream telegram_zws_5 { server 149.154.170.200:443; keepalive 64; }
upstream telegram_kws_5 { server 149.154.170.100:443; keepalive 64; }
upstream cdn1.cdn-telegram.org { server 34.111.15.3:443; keepalive 64; }
upstream cdn4.cdn-telegram.org { server 34.111.35.152:443; keepalive 64; }
upstream cdn5.cdn-telegram.org { server 34.111.108.175:443; keepalive 64; }

server {
    server_name .telegram.org .t.me .telegram.dog .telegram.me .tg.dev .telesco.pe .cdn-telegram.org;
    set $backend $telegram_backend;
    proxy_request_buffering off;
    include shared/server/base.conf;
}
