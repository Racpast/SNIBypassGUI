# ==============================================================================
# Resolvers
# ==============================================================================

[resolvers.googledns-plain]
endpoint = "8.8.8.8"

[resolvers.dnspod-doh]
endpoint = "https://doh.pub/dns-query"
bootstrap = "@googledns-plain"

[resolvers.cloudflare-dot]
endpoint = "tls://1.1.1.1"

[resolvers.cloudflare-doh]
endpoint = "https://dns.cloudflare.com/dns-query"
upstream = "saas.sin.fan"
bootstrap = "@dnspod-doh"

  [resolvers.cloudflare-doh.ech]
  mode = "doh-with-fallback"
  config = "AEX+DQBBLQAgACAxQqjtKV8aN6XxFvuDitIIktkPDIJnbKcXPyGbTEl4ewAEAAEAAQASY2xvdWRmbGFyZS1lY2guY29tAAA="
  require_ech = true
  ech_refresh = "1h"
  ech_domain = "cloudflare-ech.com"


# ==============================================================================
# Templates
# ==============================================================================

[templates.cf-optimize]
upstream = "cf.090227.xyz"
address_family = "ipv4"
resolver = "@dnspod-doh"

[templates.nat64-proxy]
nat64_prefix = "2a01:4f8:c2c:123f:64:5::"
address_family = "ipv4"
resolver = "@cloudflare-doh"


# ==============================================================================
# Regexes
# ==============================================================================

# [regexes.cdn-upos]
# pattern = "^upos-[a-z0-9-]+\\.akamaized\\.net$"
# scope_suffix = ["*.akamaized.net"]

[regexes.deviantart-non-cloudfront]
pattern = "^(?:(?:fc|orig|img|pre|t|prnt|film|vid)\\d{2}|sh|sitemaps|staff|phrac)\\.deviantart\\.net$"
scope_suffix = ["*.deviantart.net"]


# ==============================================================================
# Global
# ==============================================================================

[global]
log = "info"
connect_timeout = "5s"
resolver = "@dnspod-doh"
ech_refresh = "1h"
unmatched = "close"

[global.http2]
enabled = true
probe = "warn"

[ca]
cert_path = "ca/ca.crt"
key_path  = "ca/ca.key"
common_name = "SNIBypassGUI Local CA"
organization = "Racpast"
leaf_validity_days = 397
install_to_system_root = true

[store]
enabled = true
dir = "certs"
renew_margin_days = 30

[cache]
capacity = 8192
ttl_secs = 86400

[psl]
source = "file"
max_age = "30d"
auto_update = true


# ==============================================================================
# Listeners
# ==============================================================================

[[listener]]
addr = 443

  [listener.ech]
  mode = "doh-with-fallback"
  config = "AEX+DQBBLQAgACAxQqjtKV8aN6XxFvuDitIIktkPDIJnbKcXPyGbTEl4ewAEAAEAAQASY2xvdWRmbGFyZS1lY2guY29tAAA="
  ech_domain = "cloudflare-ech.com"
  require_ech = true


  # ------------------------------------------------------------------------------
  # Cloudflare
  # ------------------------------------------------------------------------------

  [[listener.route]]
  use = "cf-optimize"
  type = "tls"
  match_sni = [
    # Cloudflare
    ".cloudflare.com", ".pages.dev",

    # GameBanana
    ".gamebanana.com",

    # 紳士漫畫
    ".qy0.ru", ".wcdn.date",
  ]


  # ------------------------------------------------------------------------------
