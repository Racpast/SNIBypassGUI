  # ------------------------------------------------------------------------------
  # NAT64 ECH
  # ------------------------------------------------------------------------------

  [[listener.route]]
  match_sni = [
    # ChatGPT
    ".chatgpt.com",

    # Grok
    "grok.x.com", ".grok.com", ".x.ai", ".grokipedia.com",

    # Poe
    ".poe.com",

    # Truth Social
    ".truthsocial.com",
  ]
  type = "ech"
  use = "nat64-proxy"

  # Microsoft Copilot
  [[listener.route]]
  match_sni = ["copilot.microsoft.com"]
  upstream = "copilot.microsoft.com.cdn.cloudflare.net"
  type = "ech"
  use = "nat64-proxy"


  # ------------------------------------------------------------------------------
  # NAT64
  # ------------------------------------------------------------------------------

  [[listener.route]]
  match_sni = [
    # Arena AI
    "arena.ai",

    # Bilibili
    # "@cdn-upos", "p-bstarstatic.akamaized.net",

    # Claude
    ".claude.ai",

    # MakerWorld
    ".makerworld.com",

    # SecurityTrails
    ".securitytrails.com",
  ]
  type = "tls"
  use = "nat64-proxy"

  # Bilibili
  [[listener.route]]
  match_sni = [".bilibili.tv"]
  upstream = "i.w.bilicdn1.com"
  type = "tls"
  use = "nat64-proxy"


  # ------------------------------------------------------------------------------
  # No SNI
  # ------------------------------------------------------------------------------

  # Bangumi 番组计划
  # [[listener.route]]
  # match_sni = [".bangumi.tv"]
  # upstream = "178.79.181.137"
  # type = "tls"
  # override_sni = ""

  [[listener.route]]
  match_sni = [
