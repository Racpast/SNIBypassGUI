    # Deviantart
    "deviantart.net", "@deviantart-non-cloudfront",

    # OnlyFans
    "ws2.onlyfans.com",

    # Reddit
    "gql-realtime.reddit.com",
  ]
  type = "tls"
  override_sni = ""
  resolver = "@cloudflare-doh"


  # ------------------------------------------------------------------------------
  # Only DNS
  # ------------------------------------------------------------------------------

  [[listener.route]]
  match_sni = [
    # DLsite
    ".dlsite.com",

    # Sankaku Complex
    ".sankakucomplex.com",
  ]
  type = "raw"
  resolver = "@cloudflare-doh"


  # ------------------------------------------------------------------------------
  # Default
  # ------------------------------------------------------------------------------

  [listener.default_route]
  type = "http"
  upstream = "127.0.0.1:22222"
  fail = "close"
