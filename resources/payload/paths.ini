; SNIBypassGUI service location interface.
;
; This file is a STABLE contract that lives next to SNIBypassGUI.exe and never
; moves, even though it participates in updates. It maps each service to its
; executable, so the actual layout under the program directory (e.g. the "data"
; folder) can be renamed or restructured in future releases without breaking
; startup: only this file needs to stay in place.
;
; Paths are relative to the SNIBypassGUI.exe directory.
[Paths]
Nginx=data\nginx.exe
SniGate=data\sni-gate.exe
SupportedSites=data\supported_sites.dat
; DNS redirect rules. Each line is "ACTION domain...", where ACTION is an IP
; (redirect target) or "NX" (NXDOMAIN); a domain is exact by default and ".name"
; matches the apex and all subdomains. Those two forms are also exactly what the
; Name Resolution Policy Table can express, which is how the file is installed
; verbatim as the policy that routes those names to the local DNS server. See the
; file's own header for the full syntax.
Hosts=data\dns_hosts.txt

; The uninstall manifest. It lives here, with the payload, for the same reason
; the paths above do: the program directory is NOT assumed to be ours alone
; (users may extract into a folder that already holds their own files), so
; uninstall deletes ONLY what is listed here and never sweeps the directory.
;
; Keeping the list next to the payload rather than inside the executable means
; the payload owns its own layout: adding a folder here is a payload change and
; ships through the ordinary signed update, with no need to rebuild or re-release
; the exe. The exe just executes whatever this file declares.
;
; Entries are '|'-separated and relative to the SNIBypassGUI.exe directory.
; Each entry can be:
;   1. Exact path (file or directory): data, paths.ini, config.ini
;   2. Single-level wildcard: *.new, *.bak, logs\*.log
;   3. Recursive wildcard: data\**\*.tmp, **\*.log
;
; Wildcard syntax:
;   *  - matches any characters (not path separators)
;   ?  - matches a single character
;   ** - recursively matches all subdirectories
;
; Forbidden patterns: ..\path (traversal), C:\path (absolute), **\* (redundant).
; Absolute paths, drive letters, UNC paths and any ".." component are rejected,
; so this list can never reach outside the program directory. SNIBypassGUI.exe
; itself is always removed and needs no entry. Directories are deleted with
; their contents; the program directory itself is removed only if nothing
; foreign is left in it.
[Uninstall]
Remove=data|licenses|logs|paths.ini|config.ini|*.new|*.bak
; Certificates to pull from the Trusted Root stores on uninstall, matched
; case-insensitively against a certificate's subject OR issuer common name.
; sni-gate installs its locally generated CA there ([ca] common_name in
; sni-gate.toml); if that name ever changes, change it here in the same publish.
RootCertificates=SNIBypassGUI Local CA

; Cache cleanup patterns. These are matched and deleted when the user invokes
; the cache cleanup function, but are preserved during normal operation and
; uninstall (uninstall removes the whole tree anyway).
;
; Syntax is identical to [Uninstall] Remove patterns above.
[Cache]
Clean=logs|data\temp|data\cache|data\logs|data\certs

; Directories that must exist for the payload to function correctly. Git does
; not track empty directories, so this list ensures they are created when needed:
; before starting services, after cache cleanup, and after updates.
;
; Entries are exact paths relative to the SNIBypassGUI.exe directory. Supports
; recursive creation (e.g., "data\temp\nginx" creates data\, data\temp\, and
; data\temp\nginx\ if they don't exist).
[Directories]
Required=data\temp|data\logs
